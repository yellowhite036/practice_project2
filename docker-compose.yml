services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: practice_project2
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/migrations/001_create_initial_schema.sql:/docker-entrypoint-initdb.d/001_create_initial_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d practice_project2"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5051:80"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      PORT: 3001
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: practice_project2
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      JWT_SECRET: supersecret
      # 容器內的 localhost 指的是容器自己，不是 Windows 主機。
      # host.docker.internal 是 Docker Desktop（Windows/Mac）提供的
      # 特殊網域名稱，讓容器可以連回主機上跑的服務（例如本機的 Ollama）。
      OLLAMA_URL: http://host.docker.internal:11434/api/chat
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres-data: