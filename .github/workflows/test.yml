name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: |
          server/package-lock.json
          e2e/package-lock.json

    - name: Validate Docker Compose config
      run: docker compose config

    - name: Build Docker Compose services
      run: docker compose build

    - name: Start Docker Compose
      run: docker compose up -d postgres backend frontend
      
    - name: Wait for postgres to be ready
      run: |
        until docker compose exec -T postgres pg_isready -U postgres; do
          echo "Waiting for postgres..."
          sleep 2
        done

    - name: Wait for backend to be ready
      run: |
        until curl -fsS http://localhost:3001/api/health; do
          echo "Waiting for backend..."
          sleep 2
        done

    - name: Wait for frontend to be ready
      run: |
        until curl -fsS http://localhost:8080; do
          echo "Waiting for frontend..."
          sleep 2
        done

    - name: Install dependencies
      working-directory: ./server
      run: npm ci

    - name: Run unit tests
      working-directory: ./server
      run: npm test
      
    - name: Run integration tests
      working-directory: ./server
      run: npm run test:integration
      env:
        TEST_DB_HOST: localhost
        TEST_DB_PORT: 5432
        TEST_DB_USER: postgres
        TEST_DB_PASSWORD: postgres
        TEST_DB_NAME: practice_project2
        JWT_SECRET: supersecret

    - name: Install E2E dependencies
      working-directory: ./e2e
      run: npm ci

    - name: Install Playwright browser
      working-directory: ./e2e
      run: npx playwright install --with-deps chromium

    - name: Run Playwright E2E tests
      working-directory: ./e2e
      run: npm test
      env:
        BASE_URL: http://localhost:8080
        DATABASE_HOST: localhost
        DATABASE_PORT: 5432
        DATABASE_USER: postgres
        DATABASE_PASSWORD: postgres
        DATABASE_NAME: practice_project2

    - name: Upload Playwright artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-e2e-artifacts
        path: |
          e2e/playwright-report/
          e2e/test-results/
        if-no-files-found: ignore
        retention-days: 7

    - name: Stop Docker Compose
      if: always()
      run: docker compose down -v
